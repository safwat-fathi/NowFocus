# Needs, once, at http{} level (conf.d is included there):
#   deploy/cloudflare-realip.sh | sudo tee /etc/nginx/conf.d/cloudflare-realip.conf
# The realip file makes $remote_addr the real client IP (CF-Connecting-IP, trusted only from Cloudflare ranges).
# X-Forwarded-For below must therefore OVERWRITE with $remote_addr: appending ($proxy_add_x_forwarded_for) would
# make the app see Cloudflare's edge IP, so every client behind one edge would share one login rate-limit bucket.
#
# HTTP-only bootstrap; `certbot --nginx -d api.nowfocus.online` adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name api.nowfocus.online;

    client_max_body_size 2m;   # app caps JSON bodies at 1mb

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: devices hold this open, so the default 60s read timeout would drop it.
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
