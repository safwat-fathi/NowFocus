# Admin dashboard vhost: same pm2 app as the API, but only the dashboard page and its guarded routes are reachable.
# Real-IP handling is the same as api.nowfocus.online.conf (see the note at its top): X-Forwarded-For must be overwritten
# with $remote_addr so the admin login throttle is per client.
#
# HTTP-only bootstrap; `certbot --nginx -d dash.nowfocus.online` adds the 443 block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name dash.nowfocus.online;

    client_max_body_size 64k;   # the dashboard sends no bodies of any size

    # The page itself lives at /admin inside the app; the dashboard's own fetches are relative (/v1/admin/...).
    location = / {
        proxy_pass http://127.0.0.1:3000/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/admin/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
