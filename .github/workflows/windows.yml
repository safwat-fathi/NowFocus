name: Windows

# The only thing that actually compiles the Windows-only code in
# apps/windows (hosts-file editing, the named pipe service/client, the SCM
# registration) — none of it can be type-checked on macOS, since
# `#[cfg(windows)]` code isn't compiled at all on another host target. See
# the implementation plan's "Verification" section.

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      # pnpm version comes from "packageManager" in package.json; install pnpm before setup-node so it can cache.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      # Must run before any NowFocus build: the merged tauri.windows.conf.json
      # declares now-focus-service as an externalBin sidecar, and
      # generate_context! resolves it at compile time. Tauri's sidecar
      # resolution expects the target-triple-suffixed name.
      - name: Build & stage the privileged service as a sidecar
        shell: pwsh
        run: |
          cargo build -p now-focus-service --release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/now-focus-service.exe src-tauri/binaries/now-focus-service-x86_64-pc-windows-msvc.exe

      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build

      # Unsigned debug build — proves the whole app actually links and
      # bundles, not a release artifact. (Not 100% sure `--debug` alone is
      # the right flag set for a from-scratch CI runner as of Tauri CLI v2 —
      # if this step fails on first real run, check `pnpm exec tauri build --help`
      # before assuming the Rust side is broken.)
      # Bundles the app + the staged service sidecar and runs the NSIS
      # installer hooks (which register the service). Proves the whole thing
      # links and packages; not a signed release artifact.
      # The config asks for signed updater artifacts; this build is never released, so sign with a throwaway key.
      - name: Throwaway updater signing key
        shell: pwsh
        run: |
          pnpm exec tauri signer generate --ci -w "$env:RUNNER_TEMP/ci.key"
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content "$env:RUNNER_TEMP/ci.key" -Raw).Trim())" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
          # tauri build validates the configured pubkey, so point it at the throwaway key's too.
          $pub = (Get-Content "$env:RUNNER_TEMP/ci.key.pub" -Raw).Trim()
          "TAURI_CONFIG={`"plugins`":{`"updater`":{`"pubkey`":`"$pub`"}}}" >> $env:GITHUB_ENV
      - run: pnpm exec tauri build --debug

  # A release installer for hands-on testing, built on demand (Actions > Windows > Run workflow). Unsigned, so
  # Windows SmartScreen warns on first run: More info > Run anyway. The installer registers the NowFocus
  # service (needs admin once) and installs for all users.
  installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      # The merged tauri.windows.conf.json declares now-focus-service as an externalBin sidecar, so it must exist
      # (with the target-triple suffix) before the app is built.
      - name: Build & stage the privileged service as a sidecar
        shell: pwsh
        run: |
          cargo build -p now-focus-service --release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/now-focus-service.exe src-tauri/binaries/now-focus-service-x86_64-pc-windows-msvc.exe

      - run: pnpm install --frozen-lockfile
      # The config asks for signed updater artifacts; this build is never released, so sign with a throwaway key.
      - name: Throwaway updater signing key
        shell: pwsh
        run: |
          pnpm exec tauri signer generate --ci -w "$env:RUNNER_TEMP/ci.key"
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content "$env:RUNNER_TEMP/ci.key" -Raw).Trim())" >> $env:GITHUB_ENV
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
          # tauri build validates the configured pubkey, so point it at the throwaway key's too.
          $pub = (Get-Content "$env:RUNNER_TEMP/ci.key.pub" -Raw).Trim()
          "TAURI_CONFIG={`"plugins`":{`"updater`":{`"pubkey`":`"$pub`"}}}" >> $env:GITHUB_ENV
      - run: pnpm exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: NowFocus-windows-x64-setup
          path: apps/windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Public release: push a tag `windows-v<version>` (see docs/windows-release.md). Publishes the installer, its updater
  # signature and latest.json to a GitHub Release; api.nowfocus.online serves downloads and update checks from there.
  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("windows-v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $v" }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      - name: Build & stage the privileged service as a sidecar
        shell: pwsh
        run: |
          cargo build -p now-focus-service --release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/now-focus-service.exe src-tauri/binaries/now-focus-service-x86_64-pc-windows-msvc.exe

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/windows
          tagName: ${{ github.ref_name }}
          releaseName: NowFocus for Windows ${{ github.ref_name }}
          releaseBody: "Unsigned installer: Windows SmartScreen warns on first run. Choose More info, then Run anyway. Details: https://nowfocus.online/download/windows/"
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
