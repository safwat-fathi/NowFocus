name: Windows

# The only thing that actually compiles the Windows-only code in
# apps/windows (hosts-file editing, the named pipe service/client, the SCM
# registration) — none of it can be type-checked on macOS, since
# `#[cfg(windows)]` code isn't compiled at all on another host target. See
# the implementation plan's "Verification" section.

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      # pnpm version comes from "packageManager" in package.json; install pnpm before setup-node so it can cache.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      # Must run before any NowFocus build: the merged tauri.windows.conf.json
      # declares now-focus-service as an externalBin sidecar, and
      # generate_context! resolves it at compile time. Tauri's sidecar
      # resolution expects the target-triple-suffixed name.
      - name: Build & stage the privileged service as a sidecar
        shell: pwsh
        run: |
          cargo build -p now-focus-service --release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/now-focus-service.exe src-tauri/binaries/now-focus-service-x86_64-pc-windows-msvc.exe

      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build

      # Unsigned debug build — proves the whole app actually links and
      # bundles, not a release artifact. (Not 100% sure `--debug` alone is
      # the right flag set for a from-scratch CI runner as of Tauri CLI v2 —
      # if this step fails on first real run, check `pnpm exec tauri build --help`
      # before assuming the Rust side is broken.)
      # Bundles the app + the staged service sidecar and runs the NSIS
      # installer hooks (which register the service). Proves the whole thing
      # links and packages; not a signed release artifact.
      - run: pnpm exec tauri build --debug

  # A release installer for hands-on testing, built on demand (Actions > Windows > Run workflow). Unsigned, so
  # Windows SmartScreen warns on first run: More info > Run anyway. The installer registers the NowFocus
  # service (needs admin once) and installs for all users.
  installer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/windows/package.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/windows/pnpm-lock.yaml

      # The merged tauri.windows.conf.json declares now-focus-service as an externalBin sidecar, so it must exist
      # (with the target-triple suffix) before the app is built.
      - name: Build & stage the privileged service as a sidecar
        shell: pwsh
        run: |
          cargo build -p now-focus-service --release
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/release/now-focus-service.exe src-tauri/binaries/now-focus-service-x86_64-pc-windows-msvc.exe

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: NowFocus-windows-x64-setup
          path: apps/windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error
