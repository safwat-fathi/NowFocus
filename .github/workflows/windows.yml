name: Windows

# The only thing that actually compiles the Windows-only code in
# apps/windows (hosts-file editing, the named pipe service/client, the SCM
# registration) — none of it can be type-checked on macOS, since
# `#[cfg(windows)]` code isn't compiled at all on another host target. See
# the implementation plan's "Verification" section.

on:
  push:
    branches: [main]
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["apps/windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      # Unsigned debug build — proves the whole app actually links and
      # bundles, not a release artifact. (Not 100% sure `--debug` alone is
      # the right flag set for a from-scratch CI runner as of Tauri CLI v2 —
      # if this step fails on first real run, check `npx tauri build --help`
      # before assuming the Rust side is broken.)
      - run: npx tauri build --debug
      - name: Build the background service binary
        run: cargo build -p now-focus-service --verbose
