[package]
name = "NowFocus"
version = "0.4.3"
description = "NowFocus for Windows"
authors = ["NowFocus"]
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix is required so the lib target doesn't collide with the
# bin target's name on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "now_focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
now-focus-core = { path = "../core" }
now-focus-ipc = { path = "../ipc" }
now-focus-sync = { path = "../sync" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["net", "io-util", "time"] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Only for UI Automation (browser_guard): windows-sys has no COM wrappers. Already in the lockfile via tauri.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
