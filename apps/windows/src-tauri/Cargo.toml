[package]
name = "NowFocus"
version = "0.1.0"
description = "NowFocus for Windows"
authors = ["NowFocus"]
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix is required so the lib target doesn't collide with the
# bin target's name on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "now_focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
now-focus-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# Windows-only enforcement deps land here in Phase 3/4 behind
# `[target.'cfg(windows)'.dependencies]`. Kept out for now so this crate
# builds identically on every host while the UI is the focus.
