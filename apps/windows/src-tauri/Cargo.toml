[package]
name = "NowFocus"
version = "0.1.0"
description = "NowFocus for Windows"
authors = ["NowFocus"]
edition.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix is required so the lib target doesn't collide with the
# bin target's name on Windows: https://github.com/rust-lang/cargo/issues/8519
name = "now_focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
now-focus-core = { path = "../core" }
now-focus-ipc = { path = "../ipc" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["net", "io-util", "time"] }
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
