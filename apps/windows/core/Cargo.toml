[package]
name = "now-focus-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

# Platform-neutral on purpose: no windows-only dependencies here, so this
# crate builds and tests on any host OS. See apps/windows/core/src/lib.rs.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled", "trace"] }
thiserror = "1"
