name: NowFocusIOS
options:
  bundleIdPrefix: app.getnowfocus.ios
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.27.0

# Logic, design tokens and voice-note files are shared with apps/macos by path, not copied or moved:
# the macOS Core is Foundation-only (plus GRDB) and compiles for iOS as-is.
# ponytail: extract into a local Swift package if iOS and macOS Core diverge.
targets:
  NowFocusCore:
    type: framework
    platform: iOS
    sources:
      - ../macos/NowFocusCore
    dependencies:
      - package: GRDB
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getnowfocus.ios.NowFocusCore
      GENERATE_INFOPLIST_FILE: YES

  NowFocusIOS:
    type: application
    platform: iOS
    sources:
      - path: NowFocusIOS
      - path: Shared
      - path: ../macos/NowFocus/NowFocusTokens.swift
      - path: ../macos/NowFocus/Audio/VoiceRecorder.swift
      - path: ../macos/NowFocus/Audio/VoiceNotePlayer.swift
      - path: ../macos/NowFocus/Fonts/archivo_variable.ttf
    dependencies:
      - target: NowFocusCore
      - target: NowFocusLiveActivity
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getnowfocus.ios
      PRODUCT_NAME: NowFocus
      GENERATE_INFOPLIST_FILE: YES
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSSupportsLiveActivities: YES
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "NowFocus can record a 10-second note to yourself for a Strict session. It stays on this iPhone, and you hear it only if you try to end that session early."

  NowFocusLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: NowFocusLiveActivity
      - path: Shared
      - path: ../macos/NowFocus/NowFocusTokens.swift
    info:
      path: NowFocusLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: NowFocus
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.getnowfocus.ios.LiveActivity
      MARKETING_VERSION: "0.1"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1"
      SKIP_INSTALL: YES
