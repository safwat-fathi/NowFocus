<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #09090b;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 20px;
        padding: 48px 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
        max-width: 600px;
        width: 100%;
      }
      .status {
        display: inline-block;
        color: #ef4444;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .main-text {
        color: #f4f4f5;
        font-size: 38px;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 24px;
      }
      .sub-text {
        color: #71717a;
        font-size: 16px;
        margin-bottom: 40px;
      }
      .btn {
        background: #27272a;
        color: #a1a1aa;
        border: 1px solid #3f3f46;
        padding: 14px 28px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 600;
        display: inline-block;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="status">Error 404</div>
      <div class="main-text">Original task<br />not found.</div>
      <div class="sub-text">
        You opened LinkedIn 20 minutes ago to do something else.
      </div>
      <div class="btn">Keep Scrolling ▾</div>
    </div>
  </body>
</html>
